name: Sync qcoderx fork

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-qcoderx-fork-main
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.repository == 'Automo-ASK/Clippit' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the complete upstream history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check fork credential
        id: fork-credential
        env:
          FORK_SYNC_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          if [ -z "${FORK_SYNC_TOKEN:-}" ]; then
            echo "::warning::FORK_SYNC_TOKEN is not configured. The fork's scheduled reconciliation will handle this update."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream main into the fork
        if: steps.fork-credential.outputs.available == 'true'
        env:
          FORK_SYNC_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
          FORK_REPOSITORY: qcoderx/Clippit
        run: |
          set -euo pipefail

          git config user.name "Clippit fork sync"
          git config user.email "fork-sync@users.noreply.github.com"
          git remote add fork "https://x-access-token:${FORK_SYNC_TOKEN}@github.com/${FORK_REPOSITORY}.git"

          for attempt in 1 2 3; do
            git fetch fork main

            if git merge-base --is-ancestor "$GITHUB_SHA" fork/main; then
              echo "Fork already contains ${GITHUB_SHA}."
              exit 0
            fi

            git switch --force-create fork-sync fork/main
            git merge --no-ff --no-edit \
              -m "Sync upstream main at ${GITHUB_SHA:0:12}" \
              "$GITHUB_SHA"

            if git push fork HEAD:main; then
              echo "Fork updated to include ${GITHUB_SHA}."
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "::error::Fork changed during all three sync attempts."
              exit 1
            fi

            echo "Fork changed during attempt ${attempt}; fetching and retrying."
          done

  reconcile-from-fork:
    if: >-
      github.repository == 'qcoderx/Clippit' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the complete fork history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream main into this fork
        run: |
          set -euo pipefail

          git config user.name "Clippit fork sync"
          git config user.email "fork-sync@users.noreply.github.com"
          git remote add upstream https://github.com/Automo-ASK/Clippit.git
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Fork already contains upstream main."
            exit 0
          fi

          git merge --no-ff --no-edit \
            -m "Reconcile upstream main at $(git rev-parse --short=12 upstream/main)" \
            upstream/main
          git push origin HEAD:main
