<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Clippit · Threads Metrics</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700;800&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --lime: #B8FF38;
    --gold: #EFC884;
    --paper: #F7F8F2;
    --ink: #14150F;
    --muted: #6B6E60;
    --line: #E4E6DA;
    --white: #FFFFFF;
    --threads-black: #000000;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 40px 20px 80px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  h1 { font-size: clamp(28px, 5vw, 44px); font-weight: 800; letter-spacing: -0.02em; margin: 0; }
  .scribble { font-family: "Kalam", cursive; color: var(--muted); font-size: 18px; }
  .card {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 24px;
    margin-top: 24px;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--lime);
    color: var(--ink);
    border: 1px solid var(--ink);
    border-radius: 999px;
    padding: 12px 22px;
    font: inherit; font-weight: 700;
    text-decoration: none;
    cursor: pointer;
  }
  .btn.threads {
    background: var(--threads-black);
    color: white;
    border-color: transparent;
  }
  .btn.ghost { background: transparent; border-color: var(--line); font-weight: 500; }
  .btn:active { transform: translateY(1px); }
  .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: space-between; }
  .who { display: flex; align-items: center; gap: 12px; }
  .who img { width: 52px; height: 52px; border-radius: 999px; object-fit: cover; background: var(--line); }
  .who b { display: block; font-size: 17px; }
  .who span { color: var(--muted); font-size: 14px; }
  .who .verified { color: #0095F6; margin-left: 4px; }
  .totals { display: flex; gap: 28px; margin-top: 20px; flex-wrap: wrap; }
  .stat .n { font-size: 32px; font-weight: 800; letter-spacing: -0.02em; }
  .stat .l { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; }
  .bio { color: var(--muted); margin-top: 12px; font-size: 14px; max-width: 500px; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  th, td { text-align: right; padding: 12px 10px; border-bottom: 1px solid var(--line); font-size: 14px; }
  th { color: var(--muted); font-weight: 500; text-transform: uppercase; font-size: 11px; letter-spacing: 0.06em; }
  th:first-child, td:first-child { text-align: left; }
  .thread { display: flex; align-items: flex-start; gap: 12px; max-width: 420px; }
  .thread img { width: 46px; height: 46px; border-radius: 10px; object-fit: cover; background: var(--line); flex: none; }
  .thread a { color: var(--ink); text-decoration: none; font-weight: 500; font-size: 13px; line-height: 1.4; }
  .thread a:hover { text-decoration: underline; }
  .type-badge {
    display: inline-block; font-size: 10px; font-weight: 700;
    padding: 1px 6px; border-radius: 4px; text-transform: uppercase;
    letter-spacing: 0.04em; margin-left: 6px;
  }
  .type-badge.text_post { background: var(--line); color: var(--ink); }
  .type-badge.image { background: #E3F0FF; color: #2563EB; }
  .type-badge.video { background: #FEE2E2; color: #DC2626; }
  .type-badge.carousel { background: #FEF3C7; color: #D97706; }
  .type-badge.quote { background: #F3E8FF; color: #9333EA; }
  .views { font-weight: 800; }
  .muted { color: var(--muted); }
  .msg { padding: 16px 0; color: var(--muted); }
  .err { color: #B23B2E; }
  @media (max-width: 640px) {
    .hide-sm { display: none; }
    .thread { max-width: 220px; }
    .totals { gap: 16px; }
    .stat .n { font-size: 24px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Threads Metrics</h1>
    <span class="scribble">connect your account, see the numbers</span>
  </header>

  <div class="card" id="panel">
    <div class="msg">Loading…</div>
  </div>
</div>

<script>
const panel = document.getElementById("panel");
const nf = new Intl.NumberFormat();

function fmtDate(iso) {
  if (!iso) return "";
  return new Date(iso).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
}

function typeBadge(t, isQuote) {
  if (isQuote) return `<span class="type-badge quote">QUOTE</span>`;
  const map = { TEXT_POST: "text_post", IMAGE: "image", VIDEO: "video", CAROUSEL_ALBUM: "carousel" };
  const cls = map[t] || "text_post";
  const label = t === "TEXT_POST" ? "TEXT" : (t || "TEXT");
  return `<span class="type-badge ${cls}">${label}</span>`;
}

function truncate(s, n) {
  if (!s) return "No text";
  return s.length > n ? s.slice(0, n) + "…" : s;
}

function connectView(error) {
  panel.innerHTML = `
    <div class="row">
      <div>
        <b>Not connected</b>
        <div class="muted">Authorize Clippit to read your Threads posts and insights.</div>
      </div>
      <a class="btn threads" href="/login">
        <svg width="18" height="20" viewBox="0 0 192 227" fill="currentColor"><path d="M141.537 88.988a66.667 66.667 0 0 0-2.518-1.143c-1.482-27.307-16.403-42.94-41.457-43.1h-.34c-14.986 0-27.449 6.396-35.12 18.036l13.779 9.452c5.73-8.695 14.724-10.548 21.348-10.548h.229c8.249.053 14.474 2.452 18.503 7.129 2.932 3.405 4.893 8.111 5.864 14.05-7.314-1.243-15.224-1.626-23.679-1.14-23.82 1.371-39.134 15.24-38.37 34.757.39 9.95 5.092 18.517 13.24 24.111 6.882 4.727 15.72 7.06 24.895 6.576 12.126-.641 21.623-5.267 28.238-13.744 5.023-6.445 8.198-14.6 9.601-24.678 5.757 3.472 10.041 8.098 12.485 13.678 4.151 9.482 4.395 25.053-3.635 33.083-8.856 8.856-19.504 12.666-37.357 12.79-19.77-.137-34.718-6.498-44.378-18.906C73.573 135.177 68.2 116.834 68.042 95.5c.158-21.334 5.531-39.677 15.973-54.49 9.66-12.407 24.608-18.768 44.378-18.906 19.93.141 35.052 6.531 44.928 18.992 4.818 6.084 8.472 13.7 10.916 22.6l15.638-4.175c-2.935-10.74-7.583-20.075-13.868-27.81C173.46 16.476 154.835 8.461 131.043 8.283h-.463c-23.636.166-42.145 8.16-55.035 23.753C62.388 48.487 55.793 70.245 55.612 95.456l-.009.552.009.551c.181 25.211 6.776 46.969 19.924 63.42 12.89 16.143 31.399 24.587 55.035 24.753h.463c21.654-.155 35.88-5.665 47.45-17.236 14.48-14.48 13.714-33.144 8.303-45.487-3.879-8.854-11.208-16.01-21.25-20.821Zm-37.21 45.109c-10.171.535-20.76-3.983-21.292-14.768-.397-8.049 5.69-17.03 25.11-18.146a95.29 95.29 0 0 1 5.537-.165c6.21 0 11.982.652 17.212 1.916-1.96 22.232-14.174 30.534-26.567 31.163Z"/></svg>
        Connect Threads
      </a>
    </div>
    ${error ? `<div class="msg err">${error}</div>` : ""}`;
}

function loadingThreads(user) {
  const verified = user.is_verified ? `<span class="verified">✓</span>` : "";
  panel.innerHTML = `
    <div class="row">
      <div class="who">
        <img src="${user.threads_profile_picture_url || ""}" alt="" />
        <div>
          <b>@${user.username || "connected"}${verified}</b>
          <span>${user.name || ""}</span>
        </div>
      </div>
      <a class="btn ghost" href="/logout">Disconnect</a>
    </div>
    ${user.threads_biography ? `<div class="bio">${user.threads_biography}</div>` : ""}
    <div class="msg">Fetching your threads and insights…</div>`;
}

function render(user, data) {
  const verified = user.is_verified ? `<span class="verified">✓</span>` : "";

  const rows = data.threads.map(t => {
    const ins = t.insights || {};
    const thumb = t.media_url || "";
    const hasImage = t.media_type === "IMAGE" || t.media_type === "VIDEO" || t.media_type === "CAROUSEL_ALBUM";
    return `
    <tr>
      <td>
        <div class="thread">
          ${hasImage && thumb ? `<img src="${thumb}" alt="" />` : ""}
          <div><a href="${t.permalink || "#"}" target="_blank" rel="noopener">${truncate(t.text, 80)}</a>${typeBadge(t.media_type, t.is_quote_status)}</div>
        </div>
      </td>
      <td class="views">${nf.format(ins.views || 0)}</td>
      <td>${nf.format(ins.likes || 0)}</td>
      <td>${nf.format(ins.replies || 0)}</td>
      <td class="hide-sm">${nf.format(ins.reposts || 0)}</td>
      <td class="hide-sm">${nf.format(ins.quotes || 0)}</td>
      <td class="muted hide-sm">${fmtDate(t.timestamp)}</td>
    </tr>`;
  }).join("");

  panel.innerHTML = `
    <div class="row">
      <div class="who">
        <img src="${user.threads_profile_picture_url || ""}" alt="" />
        <div>
          <b>@${user.username || "connected"}${verified}</b>
          <span>${user.name || ""}</span>
        </div>
      </div>
      <div style="display:flex;gap:10px">
        <button class="btn ghost" id="refresh">Refresh</button>
        <a class="btn ghost" href="/logout">Disconnect</a>
      </div>
    </div>
    ${user.threads_biography ? `<div class="bio">${user.threads_biography}</div>` : ""}
    <div class="totals">
      <div class="stat"><div class="n">${nf.format(data.count)}</div><div class="l">Threads</div></div>
      <div class="stat"><div class="n">${nf.format(data.total_views)}</div><div class="l">Total views</div></div>
      <div class="stat"><div class="n">${nf.format(data.total_likes)}</div><div class="l">Total likes</div></div>
      <div class="stat"><div class="n">${nf.format(data.total_replies)}</div><div class="l">Total replies</div></div>
      <div class="stat"><div class="n">${nf.format(data.total_reposts)}</div><div class="l">Total reposts</div></div>
      <div class="stat"><div class="n">${nf.format(data.total_quotes)}</div><div class="l">Total quotes</div></div>
    </div>
    ${data.count === 0 ? '<div class="msg">No threads found on this account.</div>' : `
    <table>
      <thead>
        <tr>
          <th>Thread</th><th>Views</th><th>Likes</th><th>Replies</th>
          <th class="hide-sm">Reposts</th><th class="hide-sm">Quotes</th>
          <th class="hide-sm">Posted</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`}`;

  const btn = document.getElementById("refresh");
  if (btn) btn.addEventListener("click", () => start());
}

async function start() {
  panel.innerHTML = '<div class="msg">Loading…</div>';
  let status;
  try {
    status = await (await fetch("/api/status")).json();
  } catch (e) {
    connectView("Could not reach the service. Is service.py running?");
    return;
  }
  if (!status.connected) {
    connectView(status.error);
    return;
  }
  loadingThreads(status.user);

  try {
    const data = await (await fetch("/api/threads")).json();
    if (data.error) {
      panel.insertAdjacentHTML("beforeend", `<div class="msg err">${data.error}</div>`);
      return;
    }
    render(status.user, data);
  } catch (e) {
    panel.insertAdjacentHTML("beforeend", '<div class="msg err">Failed to load threads.</div>');
  }
}

start();
</script>
</body>
</html>
